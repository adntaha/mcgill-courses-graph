        function render(nodes, edges) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const fontSizeConstant = Math.min(canvas.width, canvas.height) * 0.05;
            const fontSize = fontSizeConstant * ZOOM_COEFF;

            // edges
            ctx.beginPath();
            ctx.lineWidth = 1.0*ZOOM_COEFF;
            for (const edge of Object.values(edges)) {
                ctx.moveTo(nodes[edge[0]].x*ZOOM_COEFF+OFFSET_X, nodes[edge[0]].y*ZOOM_COEFF+OFFSET_Y);
                ctx.lineTo(nodes[edge[1]].x*ZOOM_COEFF+OFFSET_X, nodes[edge[1]].y*ZOOM_COEFF+OFFSET_Y);
            }
            ctx.stroke();

            // nodes
            ctx.beginPath();
            for (const node of nodes) {
                // ctx.moveTo(node.x*ZOOM_COEFF+OFFSET_X-(fontSize*0.6*node.name.length * 0.5), node.y*ZOOM_COEFF+OFFSET_Y-10);
                // ctx.fillStyle = "white";
                // ctx.fillRect(node.x*ZOOM_COEFF+OFFSET_X-(fontSize*0.6*node.name.length * 0.5), node.y*ZOOM_COEFF+OFFSET_Y-Math.min(canvas.width, canvas.height) * 0.025-5, fontSize*0.6*node.name.length, Math.min(canvas.width, canvas.height) * 0.025-5)
                ctx.font = fontSize + "px monospace";
                ctx.fillText(node.name, node.x*ZOOM_COEFF+OFFSET_X-(fontSize*0.6*node.name.length * 0.5), node.y*ZOOM_COEFF+OFFSET_Y-fontSize*0.5)
                ctx.moveTo(node.x*ZOOM_COEFF+OFFSET_X, node.y*ZOOM_COEFF+OFFSET_Y);
                ctx.arc(node.x*ZOOM_COEFF+OFFSET_X, node.y*ZOOM_COEFF+OFFSET_Y, RADIUS*ZOOM_COEFF, 0, 2*Math.PI);
                // ctx.arc(node.x*ZOOM_COEFF+OFFSET_X, node.y*ZOOM_COEFF+OFFSET_Y, RADIUS, 0, 2*Math.PI);
            }
            ctx.fill();
            ctx.stroke();

            // ctx.beginPath();
            // ctx.arc(cursor.x*ZOOM_COEFF+OFFSET_X, cursor.y*ZOOM_COEFF+OFFSET_Y, RADIUS, 0, 2*Math.PI);
            // ctx.fillStyle = "pink";
            // ctx.fill();
            // ctx.stroke();

            ctx.fillStyle = "black";
            ctx.font = Math.min(canvas.width, canvas.height) * 0.025 + "px monospace";
            console.log(ZOOM_COEFF)
            ctx.fillText(
                `${ZOOM_COEFF<0.1?"0":""}${ZOOM_COEFF<1?"0":""}${ZOOM_COEFF<10?"0":""}${Math.round(ZOOM_COEFF.toFixed(2)*100)}% zoom`,
                window.innerWidth-(fontSizeConstant*0.6*10+8),
                window.innerHeight-5);

        function _2d_euclidian_distance(node1, node2, sqrt=true) {
            const dx = node2.x - node1.x;
            const dy = node2.y - node1.y;
            if (sqrt) {
                return Math.sqrt(dx*dx + dy*dy);
            } else {
                return dx*dx + dy*dy;
            }
        }

        function update(nodes, edges, neighbours, real_timedelta, damping) {
            const k_c = 300000; //Math.pow(4 * Math.PI * 8.8541878128, -1) * Math.pow(10, 2);
            const k_s = 1; //200;
            // debugger;

            for (let i=0; i<nodes.length; i++) {
                const dt = Math.min(0.05, real_timedelta);
                // console.log("dt", dt)

                if (nodes[i].fixed && cursor.x !== null && cursor.y !== null) {
                    nodes[i].v_x = (cursor.x - nodes[i].x) / dt * 0.5;
                    nodes[i].v_y = (cursor.y - nodes[i].y) / dt * 0.5;
                    nodes[i].x = cursor.x;
                    nodes[i].y = cursor.y;
                    continue;
                };

                let SFx = 0, SFy = 0;

                // repulsion: coulomb's law
                for (let j = 0; j < nodes.length; j++) {
                    if (i === j) continue;
                    const magnitude = k_c * nodes[i].charge * nodes[j].charge * 1/Math.max(_2d_euclidian_distance(nodes[i], nodes[j], false), 10000);
                    const direction = Math.atan2(nodes[j].y - nodes[i].y, nodes[j].x - nodes[i].x);
                    SFx -= magnitude * Math.cos(direction);
                    SFy -= magnitude * Math.sin(direction);
                }

                // attraction: hooke's law
                neighbours[i].forEach((edgeNode) => {
                    const magnitude = k_s * _2d_euclidian_distance(nodes[i], nodes[edgeNode]);
                    const direction = Math.atan2(nodes[edgeNode].y - nodes[i].y, nodes[edgeNode].x - nodes[i].x);
                    SFx += magnitude * Math.cos(direction);
                    SFy += magnitude * Math.sin(direction);
                });

                const a_x = SFx / nodes[i].mass;
                const a_y = SFy / nodes[i].mass;

                if (!nodes[i].v_x) nodes[i].v_x = 0;
                if (!nodes[i].v_y) nodes[i].v_y = 0;

                nodes[i].v_x += a_x * dt;
                nodes[i].v_y += a_y * dt;

                nodes[i].v_x *= (damping ?? 0.9);
                nodes[i].v_y *= (damping ?? 0.9);
                
                nodes[i].x += nodes[i].v_x * dt;
                nodes[i].y += nodes[i].v_y * dt;
            }
        }

        async function populate() {
            const h = Math.min(canvas.width, canvas.height);
            const courses = await fetchCourses();
            console.log(courses);

            nodeNameToIndexMap = courses.map((c) => c.id);
            const nodeCount = nodeNameToIndexMap.length;
            let neighbours = {};

            const edges = courses.reduce((prev, curr, index) => {
                for (const prereq of curr.prereqs) {
                    const from = nodeNameToIndexMap.indexOf(curr.id);
                    const to = nodeNameToIndexMap.indexOf(prereq);
                    if (to === -1) continue;
                    prev.push([from, to]);
                }
                return prev;
            }, []);
            console.log(edges)
            const nodes = nodeNameToIndexMap.map((courseid, i) => {
                let res = {};
                res.name = courseid;
                res.fixed = false;
                res.charge = 5; // constant for now
                res.mass = 3; // same as above
                res.x = h/10*Math.cos(2*Math.PI/nodeCount*(i+1));
                res.y = h/10*Math.sin(2*Math.PI/nodeCount*(i+1));
                neighbours[i] = new Set(edges.filter((e) => e.includes(i)).flat().filter(n => n !== i));
                return res;
            });

            console.log(nodes)

            return { nodes, edges, neighbours };
        }

        function fake_data_populate() {

            let edges = [[0, 1], [0, 2], [0, 3], [0, 4], [4, 5], [3, 6], [3, 2]];
            const h = Math.min(canvas.width, canvas.height);
            const nodeCount = nodes.length;
            let neighbours = [];

            for (let i=0; i<nodeCount; i++) {
                nodes[i].name = "BOB"

                nodes[i].charge = 3; // constant for now
                nodes[i].mass = 3; // same as above
                nodes[i].x = h/10*Math.cos(2*Math.PI/nodeCount*(i+1));
                nodes[i].y = h/10*Math.sin(2*Math.PI/nodeCount*(i+1));

            };

            render(nodes, edges);

        async function initiate() {
            const { nodes, edges, neighbours } = await populate();

            const zero = document.timeline.currentTime;

            requestAnimationFrame(animate);
            function animate(timestamp) {
                const real_timedelta = timestamp - zero;
                update(nodes, edges, neighbours, real_timedelta);
                render(nodes, edges);
                requestAnimationFrame((t) => animate(t));
            }

            let mouseDown = false;
            let prevX = null, prevY = null;
            document.addEventListener("mousemove", (event) => {
                if (mouseDown && prevX !== null && prevY !== null) {
                    OFFSET_X += event.clientX - prevX;
                    OFFSET_Y += event.clientY - prevY;
                    prevX = event.clientX;
                    prevY = event.clientY;
                }

                if (fixedNode !== null) {
                    cursor.x = (event.clientX - OFFSET_X) / ZOOM_COEFF;
                    cursor.y = (event.clientY - OFFSET_Y) / ZOOM_COEFF;
                }
            });

            document.addEventListener("mousedown", (event) => {
                let closest_node = null;
                let closest_node_distance = Infinity;

                for (let i=0; i<nodes.length; i++) {
                    const distance = _2d_euclidian_distance({x: (event.clientX-OFFSET_X)/ZOOM_COEFF, y: (event.clientY-OFFSET_Y)/ZOOM_COEFF}, nodes[i]); // hihihihi
                    if (distance < closest_node_distance && distance < RADIUS*4/ZOOM_COEFF) {
                        closest_node_distance = distance;
                        closest_node = i;
                    }
                }

                if (closest_node !== null) {
                    nodes[closest_node].fixed = true;
                    fixedNode = closest_node;
                    return;
                }

                mouseDown = true;
                prevX = event.clientX;
                prevY = event.clientY;
            });

            document.addEventListener("mouseup", (event) => {
                mouseDown = false;
                if (fixedNode === null) return;

                nodes[fixedNode].fixed = false;
                fixedNode = null;
                cursor.x = null;
                cursor.y = null;
            });

            document.addEventListener("wheel", (event) => {
                const step = (event.deltaY > 0 ? event.deltaY*2 : event.deltaY) / (event.deltaY*2) + 0.2
                ZOOM_COEFF *= step;
            });

            document.addEventListener("resize", (event) => {
                canvas.width = event.target.innerWidth;
                canvas.height = event.target.innerHeight;
            });
        }
        initiate();
    </script>
