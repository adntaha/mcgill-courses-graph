<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McGill Courses Graph</title>
    <style>
    :root {
        --r: 1.5rem;
    }
    /*credit goes to labor and weight for these slick fonts*/
    @font-face {
        font-family: "Galaxie Copernicus";
        src: url("./assets/GalaxieCopernicus-Book.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
    }
    @font-face {
        font-family: "Galaxie Copernicus";
        src: url("./assets/Copernicus-Bold.ttf") format("truetype");
        font-weight: bold;
        font-style: normal;
        font-display: swap;
    }
    @font-face {
        font-family: "Copernicus New Cond";
        src: url("./assets/Copernicus New Cond Trial 090 Beta 029.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
    }

    body {
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
        background-color: #1e1e1d;
        font-family: "Galaxie Copernicus", serif;
    }
    main {
        display: flex;
        flex-direction: row;
        box-sizing: border-box;
        padding: 1rem;
        height: 100%;
        border-radius: var(--r);
        background-color: #1f1f1e;
        overflow: hidden;
        gap: 1.5rem;
    }
    #panel {
        display: flex;
        flex-direction: column;
        width: 30%;
        color: #9c9b92;
    }
    .course-info {
        flex: 1;
        font-weight: bold;
        background: #2c2c2a;
        border-radius: var(--r);
        padding: 1.5rem 2rem 0;
        overflow-y: scroll;
    }
    .course-info h1 {
        display: flex;
        align-items: center;
        font-family: "Copernicus New Cond", serif;
        text-transform: uppercase;
    }
    canvas {
        width: 70%;
        border-radius: var(--r);
    }
    #cog {
        width: 1.75rem;
        margin-left: auto;
    }
    .reqs {
        line-height: 1.5rem;;
    }
    .pills {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        list-style-type: none;
        column-gap: 2rem;
        row-gap: 0.5rem;
    }
    .pills li {
        margin-left: -40px;
        padding: 0.25rem 0.5rem 0.25rem 0.5rem;
        border-radius: 0.5rem;
        overflow: none;
        height: 1rem;
        color: #acacac;
        background-color: #3c3c3a;
        border: slim solid #9c9b92;
    }
    .chat {
        position: relative;
        display: flex;
        flex-direction: column;
        flex: 1;
        background: #2c2c2a;
        border-radius: var(--r);
        margin-top: 1.5rem;
        padding: 1.5rem;
        max-height: 50%;
        overflow: hidden;
        overflow-y: scroll;
    }
    .conversation {
        display: flex;
        flex-direction: column;
        position: relative;
        width: 100%;
        height: auto;
        flex: 1;
        gap: 0.75rem;
    }
    .message:nth-child(odd) {
        align-self: flex-end;
    }
    .chatbox {
        width: 100%;
        min-height: 3rem;
        color: #9c9b92;
        font-size: 1rem;
        text-indent: 1rem;
        background-color: #1f1f1e;
        border-radius: var(--r);
        outline: none;
        border: 1px solid #2c2c2a;
        margin-top: 0.5rem;
    }
    .chatbox:focus {
        outline: none
    }
    .message {
        padding: 0.75rem;
        color: #1f1f1e;
        border-radius: calc(var(--r)/2);
        background-color: #9c9b92;
        /*min(fit-content, 50%)*/
        max-width: 50%;
        width: fit-content;
        word-wrap: break-word;
    }
    .privacy {
        margin-top: 0.25rem;
        font-size: 0.75rem;
        /* line-height: 2rem; */
        
    }
    .privacy a {
        color: #5f95f9;
    }
    .privacy a:visited {
        color: #5f62f9;
    }
    @media (max-width: 767px) {
        main {
            flex-direction: column;
            height: 100%;
        }
        canvas {
            height: 40%;
            width: 100%;
            flex: none;
        }
        #panel {
            width: 100%;
            flex: 1;
            min-height: 0;
            flex-direction: column-reverse;
        }
        .chat {
            flex: 0 0 auto;
            min-height: 30%;
            max-height: 60%;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }
        .course-info {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
    }
    </style>
    <link rel="preload" href="./data/node_positions_cache.json" as="fetch" crossorigin="anonymous">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <link rel="preconnect" href="https://challenges.cloudflare.com" />
</head>
<body>
    <main>
        <canvas></canvas>
        <div id="panel">
            <div class="course-info">
                <h1><span id="course">Nothing, for now.</span><!--<svg id="cog" viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg"
        fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="miter" stroke-linecap="round"
        role="img" aria-label="settings">
    <path d="M21.88 10.44 L21.88 13.56 L19.40 14.12 L18.73 15.73 L20.09 17.88 L17.88 20.09 L15.73 18.73 L14.12 19.40 L13.56 21.88 L10.44 21.88 L9.88 19.40 L8.27 18.73 L6.12 20.09 L3.91 17.88 L5.27 15.73 L4.60 14.12 L2.12 13.56 L2.12 10.44 L4.60 9.88 L5.27 8.27 L3.91 6.12 L6.12 3.91 L8.27 5.27 L9.88 4.60 L10.44 2.12 L13.56 2.12 L14.12 4.60 L15.73 5.27 L17.88 3.91 L20.09 6.12 L18.73 8.27 L19.40 9.88 Z"/>
    <circle cx="12" cy="12" r="3.3"/>
    </svg>--></h1>
                <ul class="pills">
                </ul>
                <ul class="reqs">
                    <li id="prereqs">Prequisites:</li>
                    <li id="coreqs">Corequisites:</li>
                    <li>Restrictions: <span id="restrictions"></span></li>
                </ul>
                <p id="description"></p>
            </div>
            <div class="chat">
                <div class="conversation">
                    <!-- <div class="message">hello</div>
                    <div class="message">hi</div> -->
                </div>
                <input type="text" class="chatbox" placeholder="What are you wondering about? ..."></input>
                <span class="privacy">no bots: you agree to Cloudflare's <a href="https://www.cloudflare.com/en-gb/turnstile-privacy-policy/">Turnstile Privacy Addendum</a></span>
                <div class="cf-turnstile" data-sitekey="0x4AAAAAADjjnaR5JZt559tN" data-size="invisible" data-callback="onTurnstileSuccess"></div>
            </div>
        </div>
    </main>
    <script src="script.js" type="module"></script>
</body>
</html>
